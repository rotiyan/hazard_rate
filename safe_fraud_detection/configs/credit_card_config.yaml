# Configuration for credit card fraud detection (weekly transaction aggregates)
# Keys match the Config schema in safe_fraud_detection/utils/config.py

model:
  input_dim: 10  # Features per week (safe-train overrides this to match the data)
  hidden_dim: 64
  num_layers: 2
  dropout: 0.2

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 100
  early_stopping_patience: 15
  gradient_clip: 1.0  # Max gradient norm
  weight_decay: 1.0e-5
  optimizer: 'adam'  # 'adam' or 'sgd'
  lr_scheduler: 'plateau'  # null or 'plateau' (ReduceLROnPlateau on validation loss)
  scheduler_factor: 0.5
  scheduler_patience: 5

data:
  normalize: 'standard'  # 'standard', 'minmax', or null
  handle_nan: 'zero'  # 'zero', 'mean', 'forward_fill'
  clip_outliers: 3.0  # Clip values beyond this many standard deviations
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42

loss:
  loss_type: 'weighted'  # 'safe', 'regular', or 'weighted'
  epsilon: 1.0e-7
  # Balance fraud and censored cards from the training split:
  # event_weight = N / (2 * num_fraud), censored_weight = N / (2 * num_censored)
  auto_weight: true
  event_weight: 1.0  # Used when auto_weight is false
  censored_weight: 1.0

evaluation:
  threshold: 0.5  # Survival probability threshold for fraud detection
  eval_timestamps: [3, 7, 12, 25, 51]  # 0-indexed weeks: ~1, 2, 3, 6 and 12 months

data_path: 'data/credit_card_data.npz'
checkpoint_dir: 'checkpoints/credit_card/'
log_dir: 'logs/credit_card/'
device: 'auto'  # 'auto' (cuda if available, else cpu), 'cuda', or 'cpu'
